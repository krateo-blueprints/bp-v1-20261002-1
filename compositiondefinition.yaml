# REGISTERS this blueprint: core-provider pulls the chart, generates the CRD from values.schema.json
# and serves the Kind BpV1202610021 as composition.krateo.io/v0-1-0.
# Register it from the portal once release 0.1.0 is green (builder deliverables -> Register).
# The same file is attached to https://github.com/krateo-blueprints/bp-v1-20261002-1/releases/tag/0.1.0.
# The version is Chart.yaml's, literally; the release workflow refuses a tag that differs.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: bp-v1-20261002-1
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/bp-v1-20261002-1
    version: 0.1.0
  apiRef:
    name: bp-v1-20261002-1-status
    namespace: krateo-system
  statusDataTemplate:
    - expression: ${ .api.level // 0 }
      forPath: architectureLevel
      type: integer
    - expression: ${ [ .api.waitingOn[]?.id ] }
      forPath: waitingOn
      type: array
    - expression: ${ .api.allReady == true }
      forPath: architectureReady
      type: boolean
